<!doctype html>
<html lang="en">
  <head>
    <!-- BASIC META -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PRIMARY SEO -->
    <title>Instant Doctor Consultation App | Online & Home Healthcare Platform</title>

    <meta name="description" content="Connect with verified doctors instantly. Book clinic appointments, request home visits, and get healthcare support through our all-in-one telemedicine platform." />

    <meta name="author" content="Your Company Name" />

    <!-- INDEXING -->
    <meta name="robots" content="index, follow" />

    <!-- CANONICAL -->

    <!-- OPEN GRAPH (FACEBOOK / LINK PREVIEW) -->
    <meta property="og:title" content="Instant Doctor Consultation App | Healthcare Made Simple" />

    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instant Doctor Consultation App" />
    <meta name="twitter:description" content="Fast, simple, and accessible healthcare at your fingertips." />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />

    <!-- FAVICON -->
    <link rel="icon" href="/favicon.ico" />

    <!-- THEME COLOR -->
    <meta name="theme-color" content="#2563EB" />

    <!-- APP NAME -->
    <meta name="application-name" content="Your App Name" />

    <!-- STRUCTURED DATA (VERY IMPORTANT FOR SEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "name": "Your App Name",
        "url": "https://yourdomain.com",
        "logo": "https://yourdomain.com/logo.png",
        "description": "A telemedicine platform to connect patients with verified doctors for instant consultation, clinic visits, and home healthcare.",
        "areaServed": "India",
        "availableService": [
          {
            "@type": "MedicalTherapy",
            "name": "Online Doctor Consultation"
          },
          {
            "@type": "MedicalTherapy",
            "name": "Home Visit Healthcare"
          },
          {
            "@type": "MedicalTherapy",
            "name": "Clinic Appointment Booking"
          }
        ]
      }
    </script>

    <!-- PERFORMANCE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  </head>

  <body>
    <div id="root"></div>

    <!-- MAIN APP -->
    <script type="module" src="/src/main.tsx"></script>
